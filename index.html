/* ===== V1 rétro (console portable) ===== */
:root{--ink:#181818;--paper:#f8f8f0;--ox:0px;--oy:0px;--ow:100vw;--oh:100vh;--dl:0px;--dw:100vw;--db:8px}
body{font-family:'Pixelify Sans','Courier New',monospace;background:#262c33;background-image:none;color:#e8e8e0;min-height:100dvh}
h3,h4,#ti h1,.pf{font-family:'Press Start 2P','Pixelify Sans',monospace;font-weight:400}
body.px canvas{image-rendering:pixelated}
#w{border-radius:0;box-shadow:0 0 0 4px #0c0c0c,0 0 0 8px #6b7078;margin-top:12px;background:#000}
.inf,#msg,#dlg,#pn,#ch,#mn,.toast{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:6px;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 5px var(--ink);font-family:inherit}
#ch button,#mn button,#pn button,#ti button{background:transparent;border:0;box-shadow:none;border-radius:0;color:var(--ink);font:inherit;font-weight:400;text-align:left;padding:6px 8px 6px 24px;min-height:0;min-width:0;position:relative;transform:none}
#ch button::before,#mn button::before,#pn button::before,#ti button::before{content:'';position:absolute;left:5px;top:50%;transform:translateY(-50%);font-size:13px}
#ch button.cur::before,#mn button.cur::before,#pn button.cur::before,#ti button.cur::before{content:'▶'}
#pn button.cur,#ti button.cur{background:#e0e0d4}
#ch button:disabled,#mn button:disabled,#pn button:disabled{opacity:.38}
#pn input.cur,#pn select.cur{outline:3px solid var(--ink)}
#dlg{position:fixed;left:calc(var(--dl) + 8px);width:calc(var(--dw) - 16px);right:auto;bottom:calc(var(--db) + 8px);max-width:none;margin:0;font-size:17px;line-height:1.35;padding:14px 20px 18px;min-height:78px;white-space:pre-wrap;z-index:22}

@keyframes bl{50%{opacity:0}}
#ch{position:fixed;left:auto;top:auto;transform:none;right:calc(100vw - var(--dl) - var(--dw) + 12px);bottom:calc(var(--db) + 104px);padding:8px 10px 8px 4px;gap:0;max-height:55vh;overflow:auto;z-index:30}

#ti{position:fixed;left:var(--ox);top:var(--oy);width:var(--ow);height:var(--oh);right:auto;bottom:auto;background:var(--paper);color:var(--ink);z-index:40;gap:10px}
#ti h1{font-size:30px;letter-spacing:2px;text-shadow:3px 3px 0 #b8b8a8;color:var(--ink);margin:6px 0}

#tmo{display:flex;gap:6px;align-items:flex-end;justify-content:center;min-height:72px}
#slots{flex-direction:column!important;align-items:stretch!important;width:min(86%,340px);margin:6px auto!important}

const GUIDE=[
['Bienvenue à Aérélia',`<p>Aérélia est un monde peuplé de <b>Lunaires</b>, des créatures liées aux <b>Éclats lunaires</b>. Toi, tu pars de ton village avec un seul rêve : <b>devenir Maître des Lunaires</b>.</p><p>Le Professeur Sauge t'attend à son laboratoire pour te confier ton premier partenaire. Ensuite : explore les routes, <b>capture des Lunaires</b>, bats les champions d'arène pour gagner leurs <b>badges</b>, démasque la Team Vesper, puis brave la Ligue.</p><p>Ton rival, lui aussi, a commencé son voyage… Ce guide explique tout et se relit à tout moment : ☰ Menu → Guide.</p>`],
['Marcher',`<p><b>Clavier :</b> flèches ou WASD · <b>Z / Espace</b> = bouton A · <b>X</b> = bouton B · <b>Entrée</b> = START · <b>P</b> = SELECT.<br><b>Téléphone :</b> croix directionnelle, boutons A et B, START et SELECT.</p><p><b>A</b> parle, ouvre, pêche, valide. <b>B</b> annule et ferme ; maintenu, il fait <b>courir</b>. <b>START</b> ouvre le menu, <b>SELECT</b> les paramètres.</p><p>Le mouvement est libre : tu glisses le long des murs. Tu peux marcher plus vite dans ⚙ Paramètres.</p><p>Entrée ou ▶ OK fait défiler les dialogues.</p>`],
['Interagir',`<p>Place-toi <b>face</b> à un personnage et appuie sur <b>A</b> pour lui parler ; face à l'eau pour <b>pêcher</b>, face à un coffre ou un buisson pour l'ouvrir.</p><p>Entre dans un bâtiment par sa porte, ressors par le <b>tapis rouge</b>. Les villageois te donnent des indices et parfois des quêtes.</p>`],
['Lire le monde',`<p>🌿 <b>Hautes herbes</b> : des créatures sauvages.<br>🟫 Chemins de terre = routes, 🪨 pavés = villes.<br>⬆⬇ flèches au sol : changer de zone.<br>✨ objet caché · 🛒 boutique.</p><p>Portes : rouge + = <b>Centre de soins</b>, violette = laboratoire, dorée = <b>arène</b>, marron = maison.</p><p>🌿 Les <b>buissons</b> bloquent le chemin ; certains, à baies rouges, cachent un petit trésor : appuie sur A face à eux. Les <b>ponts</b> et les <b>défilés</b> étroits sont des passages obligés, avant chaque ville.</p>`],
['Le menu ☰',`<p><b>Équipe</b> : choisis qui est en tête. <b>Sac</b> : soigne tes créatures. <b>Quêtes</b> : ton objectif. <b>Bestiaire</b> : créatures vues et capturées. <b>Carte</b> : voyage rapide. <b>Succès</b>, <b>Paramètres</b>, <b>Sauvegarde</b>.</p><p>Raccourcis clavier : START/M menu, E équipe, V sac, Q quêtes, G bestiaire, SELECT/P paramètres.</p>`],
['Combat : les bases',`<p>À chaque tour tu choisis : <b>Combat</b> (les attaques), <b>Sac</b> (Capsules, Potions), <b>Équipe</b> (changer de créature) ou <b>Fuite</b> (impossible contre un dresseur). A valide, B revient en arrière.</p><p>La créature la plus rapide attaque en premier (la paralysie la ralentit). Une créature à 0 PV est K.O. Tes créatures gagnent de l'expérience et montent de niveau.</p>`],
['Les types',`<p>🔥 Feu bat 🌿 Plante · 🌿 Plante bat 💧 Eau · 💧 Eau bat 🔥 Feu · 🕊 Vol bat 🌿 Plante.</p><p>Une attaque « super efficace » fait ×2 de dégâts ; « pas très efficace » fait ×0,5 (même type = ×0,5). Le type Normal n'est ni fort ni faible.</p><p>Chaque créature a une attaque Normale et une attaque de son type (plus une 3e au niveau 8).</p>`],
['Capturer',`<p>Affaiblis la créature sauvage, puis lance une <b>Capsule</b>. Moins elle a de PV, plus c'est facile.</p><p>Un statut (sommeil, brûlure, paralysie) augmente encore tes chances.</p><p>Équipe pleine (6) ? Les captures vont au <b>PC</b> : parle à l'infirmière d'un Centre de soins.</p>`],
['Statuts',`<p>🔥 <b>Brûlure</b> : perd des PV chaque tour.<br>💤 <b>Sommeil</b> : rate des tours, se réveille au hasard.<br>⚡ <b>Paralysie</b> : une chance sur quatre de rater son tour.</p><p>Les attaques de Feu, Plante et Eau peuvent les infliger. Une Super Potion guérit le statut. Ils disparaissent après le combat.</p>`],
['Objets et boutique',`<p><b>Capsule</b> : capturer. <b>Potion</b> : +40 PV. <b>Super Potion</b> : +100 PV et soigne le statut.</p><p>La boutique 🛒 de chaque ville les vend contre des 💰. Tu gagnes de l'argent en battant des dresseurs et en trouvant des objets cachés.</p>`],
['Se soigner',`<p>Dans un <b>Centre de soins</b> (porte rouge) : l'infirmière soigne toute ton équipe gratuitement. Ta maison à Brumeval aussi.</p><p>Si toute ton équipe est K.O., tu te réveilles à Brumeval, soigné. Tu ne perds pas ta progression.</p>`],
['Niveaux et évolutions',`<p>Au <b>niveau 8</b>, une créature apprend une 3e attaque, plus puissante, et au <b>niveau 20</b> une 4e, encore plus forte.</p><p>Les évolutions arrivent à certains niveaux : starters niveau 10, Piaf 9, Rattou 12, Mousse 12, Crabi 14. Une créature qui évolue devient bien plus forte.</p>`],
['Arènes, badges, Ligue',`<p>6 arènes : Cendrebourg, Lunargent, Pierrefeu, Havre-d'Opale, puis Ardenfeu et Cristalbourg dans l'acte II. On les fait dans l'ordre.</p><p>Après l'aube dorée, l'<b>archipel des étoiles</b> cache 3 arènes de plus (badges 9 à 11). Il faut <b>4 badges</b> pour atteindre le Mont Croissant. Après l'histoire, la <b>Ligue</b> (5 duels) et le <b>Palais de combat</b> (série de victoires) t'attendent sur le Plateau.</p>`],
['Quêtes et secrets',`<p>Les habitants des maisons (⌂) ont des quêtes : rapporte-leur une créature précise pour une récompense.</p><p>Cherche les ✨ cachées, pêche dans les mares, explore la <b>Grotte Lunaire</b> sur la Route 2 : un coffre et une créature rare t'y attendent.</p><p>Dans ☰ Menu → Quêtes, chaque quête a ses 💡 indices et peut être suivie par le 🧭 chemin en pointillé.</p>`],
['Carte et niveaux conseillés',`<p>Le chemin : Brumeval → Route 1 → Cendrebourg → Route 2 → Lunargent → Forêt d'Argent → Route 3 → Pierrefeu → Route 4 → Havre-d'Opale → Mont Croissant.</p><p>Niveaux conseillés : Route 1 : 3-6 · Cendrebourg : 8 · Route 2 : 8-11 · Lunargent : 11-12 · Forêt : 12-15 · Route 3 : 14-17 · Route 4 : 17-20 · Mont : 20-25 · Ligue : 30+ · Acte II : 34 à 52.</p><p>Voyage rapide : ☰ Menu → Carte, vers les villes déjà visitées.</p>`],
['Réglages et sauvegarde',`<p>⚙ Paramètres : musique, volumes, vitesse du texte, <b>difficulté</b>, animations, vitesse de marche, vibrations, astuces.</p><p>Le jeu se sauvegarde tout seul, dans 3 fichiers au choix (écran titre ou Paramètres → Changer de fichier). Pour changer d'appareil : Paramètres → Exporter, copie le texte, puis Importer sur l'autre appareil.</p>`],
['Nouveautés',`<p><b>Combats doubles</b> : 2 créatures par camp (Ligue, Palais). Choisis l'attaque de chacune puis sa cible.</p><p><b>Surnoms</b> : ☰ Menu → Équipe → ✏️. <b>PC</b> : tri par niveau, type ou nom.</p><p><b>Carte</b> : ☰ Menu → Carte. L'onglet <b>Monde</b> montre les lieux découverts (touche-les pour les infos et voyager), l'onglet <b>Zone</b> le plan détaillé où tu es.</p><p><b>Bestiaire</b> : touche une créature vue pour sa fiche complète.</p><p><b>Histoire</b> : ☰ Menu → 📜 Histoire : étapes, 💡 indices et 🧭 chemin en pointillé vers ton objectif (touche G pour l'activer).</p>`],
['Version rétro et archipel',`<p><b>Style console portable</b> : boutons A/B, START, SELECT, combats à menu <b>Combat / Sac / Équipe / Fuite</b>, pixels rétro et palette Game Boy (⚙ Paramètres).</p><p><b>Acte IV</b> : après Aurion, un chemin s'ouvre au sommet du Sanctuaire solaire vers l'<b>archipel des étoiles</b> : 3 arènes (badges 9 à 11), Maître Orion et la créature légendaire Astraël.</p><p><b>Quêtes annexes</b> : les habitants avec un <b>!</b> rouge au-dessus de la tête ont une demande. ☰ Menu → Quêtes les liste avec indices et chemin 🧭.</p>`],
['Conseils de pro',`<p>• Emmène des créatures de types variés.<br>• Utilise « Changer » pour exploiter les types.<br>• Garde toujours quelques Potions et des Capsules.<br>• Les coups critiques arrivent au hasard : ne compte pas dessus.<br>• Soigne-toi avant chaque arène.</p><p>Bonne aventure !</p>`]];
