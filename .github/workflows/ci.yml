# Tests à chaque envoi de code. Le site est publié par GitHub Pages directement depuis
# la branche main (Settings → Pages → Deploy from a branch → main, dossier / (root)).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Mise en forme du code (Prettier)
        run: npm run check
      - name: Navigateur Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout (Playwright)
        run: npm test
      - name: Rapport des tests
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

