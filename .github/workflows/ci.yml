# Tests à chaque envoi de code ; publication sur GitHub Pages depuis la branche principale,
# seulement si les tests passent et si le dépôt est public (sinon l'étape est sautée).
name: Tests et publication

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mise en forme du code (Prettier)
        run: npm run check
      - name: Navigateur Chromium
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout (Playwright)
        run: npm test
      - name: Rapport des tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

  publication:
    name: Publication sur GitHub Pages
    needs: tests
    if: >-
      github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch &&
      !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fichiers du site (sans les outils de développement)
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js fonts icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
